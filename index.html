<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيانة بلاي ستيشن</title>
    <link rel="stylesheet" href="includes/style.css">
    <style>
        .contacts-container {
            margin: 15px 0;
            line-height: 1.6;
        }
        .contact-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin: 8px auto;
            max-width: 400px;
        }
        .contact-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #ffca28;
        }
        .phone-number {
            direction: ltr;
            display: inline-block;
            font-size: 1.05em;
        }
    </style>
</head>
<body>

    <h1>صيانة بلاي ستيشن</h1>
    <h3>لصيانة البلايستيشن</h3>

    <div class="contacts-container">
        <div class="contact-card">
            <div class="contact-name">صيانة بلاي ستيشن</div>
            <div>📱 <span class="phone-number">01004161904</span></div>
        </div>
    </div>

    <h3 id="UA">Running on:</h3>

    <hr>

    <div class="btn-container">
        <form id="kernel-options">
            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
            <label for="netctrl-exploit">NetCtrl</label>
            <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
            <label for="lapse-exploit">Lapse</label>
        </form>
        <button id="jeilbrek">Jeilbrek</button>
        <div class="autoJb">
            <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
            <input class="mt-2" id="autoJbInput" type="checkbox">
        </div>
    </div>

    <div class="main-layout">
        <div class="media-box">
            <img src="includes/cat.jpg" alt="A cat staring at you">
        </div>

        <pre id="console">Ready. Awaiting execution...</pre>
    </div>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
</body>
</html>
